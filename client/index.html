<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eBay Listing Builder</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        font-family: Inter, Arial, sans-serif;
        margin: 0;
        background: linear-gradient(135deg, #020617 0%, #111827 45%, #1d4ed8 100%);
        color: #f8fafc;
      }
      .wrap {
        max-width: 960px;
        margin: 0 auto;
        padding: 2rem;
      }
      .card {
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.2);
        box-shadow: 0 12px 40px rgba(2, 6, 23, 0.35);
        padding: 1.5rem;
        border-radius: 16px;
        margin-bottom: 1rem;
        backdrop-filter: blur(10px);
      }
      h1, h2 {
        margin-top: 0;
        color: #f8fafc;
      }
      .brand {
        color: #93c5fd;
      }
      label {
        display: block;
        margin-top: 0.8rem;
        font-weight: 600;
        color: #e2e8f0;
      }
      input {
        width: 100%;
        padding: 0.8rem;
        margin-top: 0.35rem;
        border-radius: 10px;
        border: 1px solid #475569;
        background: #0f172a;
        color: white;
        outline: none;
      }
      input:focus {
        border-color: #60a5fa;
        box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.25);
      }
      button {
        width: 100%;
        padding: 0.8rem 1rem;
        margin-top: 0.65rem;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        font-weight: 700;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      button:hover {
        transform: translateY(-1px);
      }
      .primary {
        background: linear-gradient(135deg, #2563eb, #3b82f6);
        color: white;
        box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
      }
      .secondary {
        background: linear-gradient(135deg, #7c3aed, #8b5cf6);
        color: white;
        box-shadow: 0 8px 20px rgba(124, 58, 237, 0.25);
      }
      .muted {
        color: #94a3b8;
      }
      .status {
        color: #86efac;
        font-weight: 600;
      }
      pre {
        white-space: pre-wrap;
        background: #020617;
        padding: 1rem;
        border-radius: 12px;
        overflow: auto;
        border: 1px solid rgba(148, 163, 184, 0.2);
      }
      .pill {
        display: inline-block;
        padding: 0.35rem 0.7rem;
        border-radius: 999px;
        background: rgba(59, 130, 246, 0.2);
        color: #bfdbfe;
        font-size: 0.85rem;
        margin-bottom: 0.75rem;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1><span class="brand">eBay</span> Listing Builder</h1>
        <span class="pill">Local MVP</span>
        <p class="muted">Local MVP for previewing and submitting draft listing data.</p>
        <p id="status">Checking backend...</p>
      </div>

      <div class="card">
        <h2>Create draft listing</h2>
        <label>Title
          <input id="title" value="" />
        </label>
        <label>Price
          <input id="price" value="" />
        </label>
        <label>Quantity
          <input id="quantity" value="" />
        </label>
        <button id="previewBtn" class="primary">Preview listing</button>
        <button id="submitBtn" class="primary" style="margin-top: 0.5rem;">Submit draft</button>
        <button id="connectBtn" class="secondary" style="margin-top: 0.5rem;">Connect eBay account</button>
      </div>

      <div class="card">
        <h2>Response</h2>
        <pre id="output">Waiting for action...</pre>
      </div>
    </div>

    <script>
      const statusEl = document.getElementById('status');
      const outputEl = document.getElementById('output');

      async function api(path, options) {
        const response = await fetch(path, options);
        const data = await response.json();
        return { response, data };
      }

      async function updateHealth() {
        try {
          const { data } = await api('http://localhost:4000/api/health');
          statusEl.textContent = data.message;
          statusEl.className = 'status';
        } catch (error) {
          statusEl.textContent = 'Backend is not responding on port 4000.';
          statusEl.style.color = '#fda4af';
        }
      }

      async function previewListing() {
        const payload = {
          title: document.getElementById('title').value,
          price: document.getElementById('price').value,
          quantity: document.getElementById('quantity').value
        };

        try {
          const { response, data } = await api('http://localhost:4000/api/listings/preview', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          statusEl.textContent = response.ok ? 'Preview generated.' : 'Preview failed.';
          outputEl.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          statusEl.textContent = 'Preview request failed.';
          outputEl.textContent = error.message;
        }
      }

      async function submitListing() {
        const payload = {
          title: document.getElementById('title').value,
          price: document.getElementById('price').value,
          quantity: document.getElementById('quantity').value
        };

        try {
          const { response, data } = await api('http://localhost:4000/api/listings/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          statusEl.textContent = response.ok ? 'Listing submitted.' : 'Submission failed.';
          outputEl.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          statusEl.textContent = 'Submission request failed.';
          outputEl.textContent = error.message;
        }
      }

      async function connectAccount() {
        try {
          const { data } = await api('http://localhost:4000/api/auth/ebay/authorize');
          outputEl.textContent = JSON.stringify(data, null, 2);
          if (data.authorizeUrl) {
            statusEl.textContent = 'Opening eBay authorization flow...';
            window.open(data.authorizeUrl, '_blank');
          }
        } catch (error) {
          statusEl.textContent = 'Authorization request failed.';
          outputEl.textContent = error.message;
        }
      }

      async function refreshAuthStatus() {
        try {
          const { data } = await api('http://localhost:4000/api/auth/ebay/status');
          statusEl.textContent = data.message;
          outputEl.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          statusEl.textContent = 'Could not refresh auth status.';
          outputEl.textContent = error.message;
        }
      }

      document.getElementById('previewBtn').addEventListener('click', previewListing);
      document.getElementById('submitBtn').addEventListener('click', submitListing);
      document.getElementById('connectBtn').addEventListener('click', connectAccount);
      document.getElementById('connectBtn').addEventListener('click', refreshAuthStatus);
      updateHealth();
      refreshAuthStatus();
    </script>
  </body>
</html>
